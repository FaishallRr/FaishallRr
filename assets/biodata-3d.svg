<svg width="760" height="450" viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biodata 3D as code">
  <!-- bayangan -->
  <ellipse cx="390" cy="416" rx="235" ry="15" fill="#ffffff" opacity="0.06">
    <animate attributeName="opacity" values="0.05;0.13;0.05" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>

    <!-- wajah atas (ekstrusi) -->
    <polygon points="110,60 170,20 670,20 610,60" fill="#1a1a1a" stroke="#4d4d4d" stroke-width="1.5"/>
    <!-- wajah samping kanan -->
    <polygon points="610,60 670,20 670,350 610,390" fill="#101010" stroke="#4d4d4d" stroke-width="1.5"/>
    <!-- wajah depan -->
    <rect x="110" y="60" width="500" height="330" fill="#050505" stroke="#ffffff" stroke-width="2"/>

    <!-- title bar -->
    <rect x="110" y="60" width="500" height="34" fill="#161616"/>
    <line x1="110" y1="94" x2="610" y2="94" stroke="#333333" stroke-width="1"/>
    <circle cx="130" cy="77" r="5" fill="#ffffff"/>
    <circle cx="148" cy="77" r="5" fill="#8a8a8a"/>
    <circle cx="166" cy="77" r="5" fill="#3d3d3d"/>
    <text x="360" y="82" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#8a8a8a">~/profile/dev.ts — identity module</text>

    <!-- kode biodata -->
    <text x="130" y="126" font-family="Courier New, monospace" font-size="15" fill="#ffffff"><tspan fill="#ffffff">const</tspan><tspan fill="#ffffff"> dev = </tspan><tspan fill="#777777">{</tspan></text>
    <text x="130" y="153" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  name: </tspan><tspan fill="#8f8f8f">"Faishal Rasyid Rusianto"</tspan><tspan fill="#777777">,</tspan></text>
    <text x="130" y="180" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  role: </tspan><tspan fill="#8f8f8f">"Web &amp; Android Developer"</tspan><tspan fill="#777777">,</tspan></text>
    <text x="130" y="207" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  campus: </tspan><tspan fill="#8f8f8f">"UDINUS · Informatics"</tspan><tspan fill="#777777">,</tspan></text>
    <text x="130" y="234" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  years: </tspan><tspan fill="#ffffff">2</tspan><tspan fill="#777777">, </tspan><tspan fill="#555555">// in the matrix</tspan></text>
    <text x="130" y="261" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  stack: [</tspan><tspan fill="#8f8f8f">"nextjs"</tspan><tspan fill="#dddddd">, </tspan><tspan fill="#8f8f8f">"react"</tspan><tspan fill="#dddddd">, </tspan><tspan fill="#8f8f8f">"node"</tspan><tspan fill="#dddddd">],</tspan></text>
    <text x="130" y="288" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  linux: </tspan><tspan fill="#ffffff">true</tspan><tspan fill="#777777">, distro: </tspan><tspan fill="#8f8f8f">"of opportunity"</tspan><tspan fill="#777777">,</tspan></text>
    <text x="130" y="315" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  hobbies: [</tspan><tspan fill="#8f8f8f">"vim"</tspan><tspan fill="#dddddd">, </tspan><tspan fill="#8f8f8f">"dark mode"</tspan><tspan fill="#dddddd">, </tspan><tspan fill="#8f8f8f">"coffee"</tspan><tspan fill="#dddddd">],</tspan></text>
    <text x="130" y="342" font-family="Courier New, monospace" font-size="15"><tspan fill="#dddddd">  status: </tspan><tspan fill="#8f8f8f">"compiling..."</tspan></text>
    <rect x="352" y="330" width="9" height="15" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.52;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="369" font-family="Courier New, monospace" font-size="15" fill="#777777">};</text>
  </g>
</svg>