<svg width="640" height="235" viewBox="0 0 640 235" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated terminal">
  <rect x="4" y="4" width="632" height="227" rx="10" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <rect x="4" y="4" width="632" height="34" rx="10" fill="#151515"/>
  <rect x="4" y="28" width="632" height="10" fill="#151515"/>
  <circle cx="26" cy="21" r="6" fill="#ffffff"/>
  <circle cx="48" cy="21" r="6" fill="#8a8a8a"/>
  <circle cx="70" cy="21" r="6" fill="#3d3d3d"/>
  <text x="320" y="26" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#777777">faishal@matrix: ~/profile</text>

  <rect x="4" y="40" width="632" height="2" fill="#ffffff" opacity="0.28">
    <animate attributeName="y" values="44;224;44" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="72" font-family="Courier New, monospace" font-size="16" fill="#ffffff" opacity="0">
    $ whoami
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.08;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="98" font-family="Courier New, monospace" font-size="16" fill="#bbbbbb" opacity="0">
    faishal_rasyid — informatics @ UDINUS
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.18;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="130" font-family="Courier New, monospace" font-size="16" fill="#ffffff" opacity="0">
    $ cat ~/mission.txt
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.32;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="156" font-family="Courier New, monospace" font-size="16" fill="#999999" opacity="0">
    &gt; build web &amp; android things that matter
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.44;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="188" font-family="Courier New, monospace" font-size="16" fill="#ffffff" opacity="0">
    $ sudo make me a sandwich
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.60;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <text x="24" y="214" font-family="Courier New, monospace" font-size="16" fill="#bbbbbb" opacity="0">
    &gt; [sudo] permission granted
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.72;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <rect x="300" y="200" width="10" height="18" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;1;0;1;0" keyTimes="0;0.72;0.74;0.8;0.85;0.88;0.92;0.95;1" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>