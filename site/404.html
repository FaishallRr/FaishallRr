<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERROR 404 // SIGNAL LOST</title>
  <style>
    :root {
      --red: #ff0045;
      --green: #00ff9d;
      --bg: #05070d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", monospace;
      color: var(--red);
      overflow: hidden;
      text-align: center;
      animation: bgFlicker 4s infinite;
    }

    @keyframes bgFlicker {
      0%, 100% { background: var(--bg); }
      92% { background: var(--bg); }
      93% { background: #150008; }
      94% { background: var(--bg); }
      97% { background: #00140d; }
      98% { background: var(--bg); }
    }

    /* CRT scanlines + garis bocor */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.05) 0 1px,
        transparent 1px 3px
      );
      pointer-events: none;
      z-index: 5;
    }

    body::after {
      content: "";
      position: fixed;
      left: 0; right: 0;
      height: 90px;
      background: linear-gradient(transparent, rgba(0, 255, 157, 0.09), transparent);
      animation: tracking 5.5s linear infinite;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes tracking {
      from { top: -12%; }
      to { top: 108%; }
    }

    .wrap { position: relative; z-index: 2; padding: 24px; }

    .err {
      font-size: clamp(4rem, 20vw, 12rem);
      font-weight: bold;
      letter-spacing: 12px;
      position: relative;
      color: var(--red);
      text-shadow: 0 0 40px rgba(255, 0, 69, 0.8);
      animation: mainGlitch 2.4s infinite steps(1);
    }

    @keyframes mainGlitch {
      0%, 88%, 100% { transform: translate(0); color: var(--red); }
      89% { transform: translate(-8px, 4px) skewX(-8deg); color: var(--green); }
      91% { transform: translate(7px, -5px) skewX(6deg); color: #fff; }
      93% { transform: translate(-4px, 2px); color: var(--red); }
      95% { transform: translate(5px, -2px); color: var(--green); }
    }

    /* layer RGB split */
    .err::before, .err::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .err::before { color: #00e5ff; z-index: -1; animation: split 3s infinite; }
    .err::after  { color: var(--green); z-index: -2; animation: split 3.7s infinite reverse; }

    @keyframes split {
      0%, 90%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); }
      91% { transform: translate(-9px, 3px); clip-path: inset(20% 0 55% 0); }
      94% { transform: translate(8px, -4px); clip-path: inset(60% 0 12% 0); }
      97% { transform: translate(-3px, 1px); clip-path: inset(5% 0 78% 0); }
    }

    .lost {
      margin-top: 8px;
      font-size: clamp(1rem, 3.5vw, 1.6rem);
      letter-spacing: 8px;
      color: var(--green);
      animation: blink 1.1s steps(2) infinite;
    }

    @keyframes blink { 50% { opacity: 0.15; } }

    .log {
      margin: 34px auto 0;
      max-width: 640px;
      text-align: left;
      font-size: clamp(0.72rem, 2vw, 0.9rem);
      color: #7d8ba3;
      background: rgba(11, 15, 23, 0.85);
      border: 1px solid rgba(255, 0, 69, 0.45);
      border-radius: 8px;
      padding: 18px 20px;
      line-height: 1.8;
      box-shadow: 0 0 40px rgba(255, 0, 69, 0.25);
      min-height: 150px;
    }
    .log .ok { color: var(--green); }
    .log .fail { color: var(--red); }
    .log .cursor { color: var(--green); animation: blink 0.8s steps(2) infinite; }

    .bar {
      width: min(460px, 84vw);
      height: 12px;
      margin: 26px auto 0;
      border: 1px solid var(--red);
      background: rgba(255, 0, 69, 0.12);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .bar i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 30%;
      background: linear-gradient(90deg, var(--red), var(--green));
      animation: load 1.6s linear infinite;
    }
    @keyframes load {
      from { transform: translateX(-110%); }
      to { transform: translateX(340%); }
    }

    .actions { margin-top: 34px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .btn {
      font-family: inherit;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      letter-spacing: 2px;
      transition: 0.25s;
      background: transparent;
    }
    .btn-red { color: #fff; border: 1px solid var(--red); background: var(--red); box-shadow: 0 0 18px rgba(255, 0, 69, 0.5); }
    .btn-red:hover { box-shadow: 0 0 36px rgba(255, 0, 69, 0.9); transform: translateY(-3px); }
    .btn-ghost { color: var(--green); border: 1px solid var(--green); }
    .btn-ghost:hover { background: rgba(0, 255, 157, 0.12); box-shadow: 0 0 24px rgba(0, 255, 157, 0.5); transform: translateY(-3px); }

    /* guncangan layar sesekali */
    .shake { animation: shake 0.28s linear 3; display: inline-block; }
    @keyframes shake {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(-6px, 3px); }
      50% { transform: translate(5px, -4px); }
      75% { transform: translate(-3px, -2px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="err shake" data-text="404">404</div>
    <div class="lost">SIGNAL&nbsp;LOST</div>

    <div class="log" id="log"></div>

    <div class="bar"><i></i></div>

    <div class="actions">
      <a class="btn btn-red" href="./">./restore_connection</a>
      <button class="btn btn-ghost" id="rerun" type="button">./reboot_system</button>
    </div>
  </div>

  <script>
    const LINES = [
      ['ok',   '> initializing kernel ................. [ OK ]'],
      ['ok',   '> mounting /dev/portrait .............. [ OK ]'],
      ['fail', '> locating requested resource ......... [ NOT FOUND ]'],
      ['fail', '> error 0xDEADBEEF: page not in matrix'],
      ['ok',   '> spawning emergency glitch protocol .. [ OK ]'],
      ['ok',   '> caffeine levels .................... [ CRITICAL ]'],
      ['fail', '> your destination went to run `rm -rf /` on itself'],
      ['ok',   '> await user input, survivor_'],
    ];

    const log = document.getElementById('log');

    function run() {
      log.innerHTML = '';
      LINES.forEach(([type, text], idx) => {
        setTimeout(() => {
          const row = document.createElement('div');
          row.className = type;
          log.appendChild(row);
          let i = 0;
          (function step() {
            row.textContent = text.slice(0, i) + (i < text.length ? '_' : '');
            if (i++ < text.length) setTimeout(step, 14);
            else if (idx === LINES.length - 1) {
              const c = document.createElement('span');
              c.className = 'cursor';
              c.textContent = ' █';
              row.appendChild(c);
            }
          })();
        }, idx * 620);
      });
    }

    run();
    document.getElementById('rerun').addEventListener('click', run);
  </script>
</body>
</html>
